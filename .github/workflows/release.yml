name: Release

# 手动触发：需先推标签 git tag -a v1.3.12 && git push fork v1.3.12
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本标签（如 v1.3.12，需已推送到远端）'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # npm workspace 在 CI 干净环境有平台二进制 bug（npm/cli#4828）
      # + workspace 图 edgesOut 崩溃——逐包独立安装绕开两个问题
      - name: 安装依赖（逐包独立）
        run: |
          for pkg in print-core print-canvas print-common; do
            cd "packages/$pkg"
            rm -rf node_modules package-lock.json
            npm install --no-package-lock
            cd ../..
          done

      - name: 构建
        run: |
          cd packages/print-core && npx vite build && npx vue-tsc -p tsconfig.build.json && cd ../..
          cd packages/print-canvas && npx vite build && npx vue-tsc -p tsconfig.build.json && node ../../scripts/inject-license-banner.mjs dist && cd ../..
          cd packages/print-common && npm run build && cd ../..

      - name: 校验标签与包版本一致
        run: |
          TAG="${{ inputs.tag }}"
          TAG="${TAG#v}"
          for pkg in core canvas; do
            VER=$(node -p "require('./packages/print-$pkg/package.json').version")
            if [ "$VER" != "$TAG" ]; then
              echo "::error::print-$pkg 版本 $VER 与标签 $TAG 不一致"
              exit 1
            fi
          done
          echo "标签与 core/canvas 版本一致：$TAG"

      # canvas 依赖 core，必须先发 core
      - name: 发布 @go-wind/print-core
        working-directory: packages/print-core
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 发布 @go-wind/print-canvas
        working-directory: packages/print-canvas
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # common（零框架宿主适配包）版本线独立（beta），admin react 端消费
      - name: 发布 @go-wind/print-common
        working-directory: packages/print-common
        run: npm publish --access public --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body_path: .github/release/notes.md
          draft: false
          prerelease: ${{ contains(inputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
