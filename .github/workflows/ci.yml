name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    name: build & test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    env:
      # render 服务的 Playwright 浏览器由独立的 render job 按需安装
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # CI 只测包本体，Electron 客户端二进制不必下载
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: rm -f package-lock.json && npm install
      # 矩阵只盖三个公开包；render 有下方专用 job，print-client 依赖 Electron 二进制暂不进矩阵
      - run: npm run build -w @go-wind/print-core
      - run: npm run build -w @go-wind/print-canvas
      - run: npm run build -w @go-wind/print-common
      - run: npm run test -w @go-wind/print-core
      - run: npm run test -w @go-wind/print-canvas
      - run: npm run test -w @go-wind/print-common
      - run: npm run lint:print-architecture

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖（不下载浏览器）
        run: rm -f package-lock.json && npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: 安装 Chromium 与系统依赖
        run: npx playwright install --with-deps chromium
      - name: 构建 core 与 render
        run: npm run build -w @go-wind/print-core && npm run build -w @go-wind/print-render
      - name: 连续纸与出图规格集成测试
        run: npm run test -w @go-wind/print-render -- src/continuous.integration.test.ts
        timeout-minutes: 5
      - name: 明细分页集成测试
        run: npm run test -w @go-wind/print-render -- src/subtotal.integration.test.ts
        timeout-minutes: 5
      - name: 码值渲染集成测试
        run: npm run test -w @go-wind/print-render -- src/codes.integration.test.ts
        timeout-minutes: 5
